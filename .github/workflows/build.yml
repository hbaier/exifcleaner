name: build
on: push
env:
  NODE_OPTIONS: --openssl-legacy-provider
jobs:
  build:
    strategy:
      max-parallel: 3
      matrix:
        target:
          - os: macos-latest
            script: packmac
          - os: windows-latest
            script: packwin
          - os: ubuntu-latest
            script: packlinux
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v5
      - name: Restore yarn cache
        uses: actions/setup-node@v5
        with:
          cache: 'yarn'
      - name: Restore ExifTool cache
        id: cache-exiftool-restore
        uses: actions/cache/restore@v4
        with:
          path: exiftool_downloads
          key: exiftool-cache-${{ runner.os }}
      - name: Install dependencies
        run: yarn install
      - name: Update ExifTool
        run: yarn update-exiftool --cache-downloads-working-dir
      - name: Build
        run: yarn ${{ matrix.target.script }} --publish never
      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ExifCleaner-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
      - name: Save ExifTool cache
        uses: actions/cache/save@v4
        with:
          path: exiftool_downloads
          key: ${{ steps.cache-exiftool-restore.outputs.cache-primary-key }}
